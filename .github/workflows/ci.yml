name: CI

# Se questo workflow è verde, Render pubblica il nuovo codice (render.yaml: autoDeployTrigger: checksPass).
# Se è rosso, online resta l'ultima versione funzionante.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test di fumo
    runs-on: ubuntu-latest
    steps:
      # Il repository È il pacchetto Python "FantaRF": va estratto in una cartella con quel nome.
      - uses: actions/checkout@v4
        with:
          path: FantaRF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FantaRF/requirements.txt
      - run: pip install -r FantaRF/requirements.txt
      - name: Avvio, bootstrap, login
        run: python -m FantaRF.deploy.smoke_test
      - name: Ponte della demo nel browser (senza browser)
        run: python -m FantaRF.pages.test_bridge

  docker:
    name: Immagine Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: FantaRF
      - name: Build
        run: docker build -t fantarf-ci FantaRF
      - name: Il container parte e risponde
        run: |
          docker run -d --name fantarf -p 10000:10000 \
            -e FANTAPG_SECRET_KEY=ci-only-key \
            -e FANTAPG_BOOTSTRAP_ADMIN_USER=ci-admin \
            -e FANTAPG_BOOTSTRAP_ADMIN_PASSWORD=Ci-Only-Password-123 \
            fantarf-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/healthz >/dev/null 2>&1; then
              echo "Il container risponde dopo ${i}s"
              curl -fsS http://127.0.0.1:10000/giocatori >/dev/null && echo "Listone raggiungibile"
              exit 0
            fi
            sleep 1
          done
          echo "Il container non ha risposto entro 30s. Log:"
          docker logs fantarf
          exit 1
